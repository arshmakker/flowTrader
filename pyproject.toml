[tool.pytest.ini_options]
# BUG-09: make `trading_system` importable for targeted pytest invocations.
# Without this, `pytest tests/test_ic_strategy.py` fails at collection.
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--cov=trading_system.core.pcr_credit_spread",
    "--cov=trading_system.core.pcr_signal",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.run]
branch = true
source = ["trading_system.core.pcr_credit_spread", "trading_system.core.pcr_signal"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 70
omit = [
    "trading_system/__init__.py",
    "trading_system/*/__init__.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E701",  # one-line if statements (common in tests)
    "E501",  # line too long (strict for HTML/strings)
    "N801",  # class naming (IC_Position is intentional)
    "N802",  # function naming (NIFTY_SPOT_TOKEN properties)
    "N806",  # variable naming in functions (FRESH_BID in tests)
    "E741",  # ambiguous variable name (l in lambdas is common)
    "N812",  # import naming (EC for expected_conditions)
    "N818",  # exception naming (OrderPollingAbandoned - not an Error suffix)
    "E402",  # module level import not at top (intentional after sys.path.insert)
    "N803",  # argument naming (twoFA matches upstream API)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
