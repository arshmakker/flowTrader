repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick
        entry: pytest -q --cov=trading_system --cov=main --cov=strategy_runner --cov-report=term-missing --cov-fail-under=68
        language: system
        pass_filenames: false
        always_run: true
